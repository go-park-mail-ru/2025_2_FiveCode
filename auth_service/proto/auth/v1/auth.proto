syntax = "proto3";

package auth;

option go_package = "backend/auth_service/pkg/auth/v1";

import "google/protobuf/empty.proto";


service Auth {
  rpc Register(RegisterRequest) returns (RegisterResponse) {}

  rpc Login(LoginRequest) returns (LoginResponse) {}

  rpc Logout(LogoutRequest) returns (google.protobuf.Empty) {}

  rpc GetUserIDBySession(GetUserIDBySessionRequest) returns (GetUserIDBySessionResponse) {}

  rpc GetCSRFToken(GetCSRFTokenRequest) returns (GetCSRFTokenResponse) {}
}


message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
    uint64 user_id = 1;
    string session_id = 2;
  }

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  uint64 user_id = 1;
  string session_id = 2;
}

message LogoutRequest {
  string session_id = 1;
}

message GetUserIDBySessionRequest {
  string session_id = 1;
}
message GetUserIDBySessionResponse {
  bool is_valid = 1;
  uint64 user_id = 2;
}

message GetCSRFTokenRequest {
  string session_id = 1;
}

message GetCSRFTokenResponse {
  string token = 1;
}
